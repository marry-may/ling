<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="ling-icon.svg" />
  <meta name="theme-color" content="#f5f8f5" />
  <script>
    // Apply the saved or system theme before the app loads, so the page does not flash light (see src/theme.ts).
    try {
      var savedTheme = localStorage.getItem('ling-theme')
      var dark = savedTheme === 'dark' || (savedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    } catch (error) {
      document.documentElement.dataset.theme = 'light'
    }
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Ling — попробуй читать</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/readerMain.tsx"></script>
</body>

</html>
